<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title id="t3Title">Title</title>
  <!--import bootstrap-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg pt-0 pb-0" style="background-color: #003B6D;">
      <div class="container-fluid h-100 gx-0 pe-2">
        <button class="navbar-toggler bg-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse h-100" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0 h-100">
            <li class="nav-item h-100">
<!--              class="active" aria-current="page" -->
              <a class="nav-link h-100 fw-bold text-white" href="index.html" id="homeNav">Home</a>
            </li>
            <li class="nav-item h-100">
              <a class="nav-link h-100 fw-bold text-white" href="index.html#food" id="tasteNav">Taste</a>
            </li>
            <li class="nav-item h-100">
              <a class="nav-link h-100 fw-bold text-white" href="index.html#see" id="seeNav">See</a>
            </li>
            <li class="nav-item h-100">
              <a class="nav-link h-100 fw-bold text-white" href="index.html#plan" id="planNav">Plan</a>
            </li>
            <li class="nav-item h-100">
              <a class="nav-link h-100 fw-bold text-white" href="FAQ.html" id="FAQNav">FAQs</a>
            </li>
          </ul>
          <form class="d-flex pb-1">
            <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
            <button class="btn btn-outline-light" type="submit">Search</button>
          </form>
        </div>
      </div>
    </nav>

    <nav aria-label="breadcrumb"
         style="background-color: #BDBDBD;
             --bs-breadcrumb-divider: '>';
             border-bottom: 2px solid darkgray;
             font-size: small;">
      <ol class="breadcrumb m-0 ps-2" id="breadcrumbList">
        <li class="breadcrumb-item active">
          <a class="fw-bold breadcrumb-link" href="index.html" aria-current="page" style="color: #003B6D;">Home
          </a>
        </li>
      </ol>
    </nav>

  </header>

  <div class="mh-100">
      <aside
          class="float-start px-1"
          style="border: gray 0.25em solid">

          <h2 class="px-1">
              Filters:
          </h2>
          <div class="filterBottomBorder px-2">
              <h4>Price:</h4>
              <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="priceThree" checked>
                  <label class="form-check-label" for="priceThree">$$$</label>
              </div>
              <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="priceTwo" checked>
                  <label class="form-check-label" for="priceTwo">$$</label>
              </div>
              <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="priceOne" checked>
                  <label class="form-check-label" for="priceOne">$</label>
              </div>
          </div>
          <div class="px-2">
              <h4>Minimum<br>Stars:</h4>
              <div class="form-check">
                  <input class="form-check-input" type="radio" name="stars" id="5star" value="5star">
                  <label class="form-check-label" for="5star">
                      5
                  </label>
              </div>
              <div class="form-check">
                  <input class="form-check-input" type="radio" name="stars" id="4star" value="4star" checked>
                  <label class="form-check-label" for="4star">
                     4
                  </label>
              </div>
              <div class="form-check">
                  <input class="form-check-input" type="radio" name="stars" id="3star" value="3star">
                  <label class="form-check-label" for="3star">
                      3
                  </label>
              </div>
              <div class="form-check">
                  <input class="form-check-input" type="radio" name="stars" id="2star" value="2star">
                  <label class="form-check-label" for="2star">
                      2
                  </label>
              </div>
              <div class="form-check">
                  <input class="form-check-input" type="radio" name="stars" id="1star" value="1star">
                  <label class="form-check-label" for="1star">
                      1
                  </label>
              </div>
          </div>
      </aside>


      <main class="container">
          <div class="h-100 row p-2" id="main">

          </div>
      </main>
  </div>

  <footer class="w-100 mw-100 p-0"
  style="background-image: url('images/beach2.jpg')">
      <div class="container m-0 w-100 mw-100 py-2 px-0"
           style="background-color: rgba(20, 20, 20, 0.60); height: 100%">
          <ul class="nav justify-content-center border-bottom p-2 m-0 h-100">
              <li class="nav-item">
                  <a href="index.html" class="nav-link px-2 footerNav">
                      Home
                  </a>
              </li>
              <li class="nav-item">
                  <a href="index.html#food" class="nav-link px-2 footerNav">
                      Taste
                  </a>
              </li>
              <li class="nav-item">
                  <a href="index.html#see" class="nav-link px-2 footerNav">
                      See
                  </a>
              </li>
              <li class="nav-item">
                  <a href="index.html#plan" class="nav-link px-2 footerNav">
                      Plan
                  </a>
              </li>
              <li class="nav-item">
                  <a href="FAQ.html" class="nav-link px-2 footerNav">
                      FAQs
                  </a>
              </li>
          </ul>
          <p class="text-center text-white pt-2">© 2026 Taniti Island</p>
      </div>
  </footer>

<script src="PopulateT3.js"></script>
<!--import bootstrap-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
